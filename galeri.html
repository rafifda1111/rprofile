<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tugas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  
  <h2>Daftar Postingan yang Telah Di-input</h2>
  <a href="kontak.html">&larr; Kembali ke Form Input</a>
  <hr>

  <!-- Tempat di mana data dari database akan dimunculkan -->
  <div id="daftarData">Memuat data...</div>

  <script>
    // Konfigurasi Supabase (URL sudah diperbaiki tanpa /rest/v1/)
    const SUPABASE_URL = 'https://ncibrdmqxlkkeyenhldz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hSYSRXclsfSJuLFgmTDLAQ_ymfBrR-V';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Fungsi untuk mengambil dan menampilkan data dari Supabase
    async function muatDataGaleri() {
      const wadah = document.getElementById('daftarData');
      
      // Ambil data dari tabel 'galeri', urutkan dari yang terbaru
      const { data, error } = await db
        .from('galeri')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        wadah.innerHTML = 'Gagal memuat data: ' + error.message;
        return;
      }

      if (data.length === 0) {
        wadah.innerHTML = 'Belum ada data yang di-input.';
        return;
      }

      // Kosongkan teks "Memuat data..." lalu tampilkan datanya
      wadah.innerHTML = '';
      data.forEach(item => {
        wadah.innerHTML += `
          <div style="border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; max-width: 400px;">
            <h3>${item.judul}</h3>
            <p>${item.deskripsi}</p>
            <img src="${item.foto_url}" width="100%" style="border-radius: 4px;" alt="Foto Postingan">
            <p style="font-size: 11px; color: gray;">Dibuat pada: ${new Date(item.created_at).toLocaleString()}</p>
          </div>
        `;
      });
    }

    // Panggil fungsi saat halaman galeri dibuka
    muatDataGaleri();
  </script>

</body>
</html>
